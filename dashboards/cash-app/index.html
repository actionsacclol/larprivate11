<!DOCTYPE html>
<html lang="en" data-krypt-status="translucent">
<head>

<title>Cash App · Learning Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     CASH APP — a learning recreation (TEST demo).
     3 tabs (floating pill nav): Money · Pay (keypad, default) · Activity.
     Pure-black + single green. Keypad is interactive.
     Data-driven — see DEFAULT_DATA. Edit toggle = click values;
     saved to your browser. Entrance animations are pure CSS.
     ============================================================ */
  :root{
    --green:#00D632;
    --bg:#000000;
    --tile:#1c1c1e;
    --tile2:#161618;
    --line:#242426;
    --text:#ffffff;
    --muted:#8a8a8e;
    --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#0a0a0a;font-family:var(--font);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;-webkit-font-smoothing:antialiased;}

  .back{position:fixed;top:18px;left:18px;z-index:50;background:#1c1c1e;color:#fff;border:1px solid #333;text-decoration:none;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;font-family:var(--font);transition:.15s;}
  .back:hover{background:#2a2a2c;}
  .toolbar{position:fixed;top:18px;right:18px;display:flex;gap:8px;z-index:50;}
  .toolbar button{background:#1c1c1e;color:#fff;border:1px solid #333;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:.15s;}
  .toolbar button:hover{background:#2a2a2c;}
  .toolbar button.on{background:var(--green);color:#00230a;border-color:var(--green);}

  .phone{position:relative;width:390px;max-width:100%;height:844px;background:var(--bg);border-radius:44px;box-shadow:0 0 0 12px #111,0 40px 90px rgba(0,0,0,.7);overflow:hidden;display:flex;flex-direction:column;}

  .statusbar{display:flex;align-items:center;justify-content:space-between;padding:15px 30px 4px;font-size:15px;font-weight:600;flex:0 0 auto;}
  .statusbar .right{display:flex;align-items:center;gap:7px;}
  .battery{border:1.5px solid #fff;border-radius:4px;width:26px;height:13px;position:relative;display:flex;align-items:center;padding:1.5px;}
  .battery::after{content:"";position:absolute;right:-4px;top:4px;width:2px;height:5px;background:#fff;border-radius:0 2px 2px 0;}
  .battery i{display:block;height:100%;background:#fff;border-radius:1.5px;width:82%;}
  .signal{display:flex;align-items:flex-end;gap:2px;height:12px;}
  .signal b{width:3px;background:#fff;border-radius:1px;display:block;}
  .signal b:nth-child(1){height:5px}.signal b:nth-child(2){height:7px}.signal b:nth-child(3){height:9px;opacity:.4}.signal b:nth-child(4){height:12px;opacity:.4}

  /* shared top bar */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 6px;flex:0 0 auto;}
  .topbar .rgt{display:flex;align-items:center;gap:12px;}
  .cir{width:42px;height:42px;border-radius:50%;background:#1a1a1c;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;transition:.15s;}
  .cir:hover{background:#242426;}
  .cir svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;}
  .cir.smiley svg{width:22px;height:22px;}
  .cir.profile{background:#ff4b4b;position:relative;}
  .cir.profile svg{stroke:#fff;fill:#fff;}
  .cir.profile .bdg{position:absolute;top:-2px;right:-2px;background:#ff2d2d;color:#fff;font-size:10px;font-weight:800;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #000;}

  .screen{flex:1;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;}
  .screen::-webkit-scrollbar{display:none;}

  .ca-view{display:none;flex:1;}
  .ca-view.on{display:flex;flex-direction:column;animation:vfade .22s ease;}
  @keyframes vfade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ============ PAY (keypad) ============ */
  .pay{flex:1;display:flex;flex-direction:column;padding:0 26px 98px;}
  .pay .amt{flex:0 0 auto;text-align:center;font-size:90px;font-weight:800;letter-spacing:-3px;padding:22px 0 6px;line-height:1;}
  .pad{flex:1;display:grid;grid-template-columns:repeat(3,1fr);align-content:center;gap:2px 0;padding:6px 8px;}
  .key{display:flex;align-items:center;justify-content:center;font-size:35px;font-weight:500;height:68px;cursor:pointer;user-select:none;border-radius:12px;transition:.1s;}
  .key:active{background:#141416;}
  .key svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.4;}
  .payrow{display:flex;gap:12px;margin-bottom:10px;}
  .payrow .pr{flex:1;background:var(--tile);color:#fff;border:0;font-family:var(--font);font-size:17px;font-weight:700;padding:16px;border-radius:34px;cursor:pointer;transition:.12s;}
  .payrow .pr:active{transform:scale(.97);}
  .paybtn{width:100%;background:#fff;color:#000;border:0;font-family:var(--font);font-size:18px;font-weight:800;padding:17px;border-radius:34px;cursor:pointer;transition:.12s;}
  .paybtn:active{transform:scale(.98);}

  /* ============ MONEY ============ */
  .money{padding:6px 22px 100px;}
  .bal-h{display:flex;align-items:center;justify-content:space-between;margin-top:8px;
    opacity:0;transform:translateY(14px);animation:rise .5s ease forwards;}
  .bal-h .lbl{display:flex;align-items:center;gap:7px;font-size:19px;font-weight:700;}
  .bal-h .lbl svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.4;}
  .bal-h .eye{width:22px;height:22px;stroke:#8a8a8e;fill:none;stroke-width:2;}
  .bal-big{font-size:56px;font-weight:800;letter-spacing:-2px;margin:6px 0 2px;line-height:1;
    opacity:0;transform:translateY(14px);animation:rise .5s .04s ease forwards;}
  .money-actions{display:flex;gap:12px;margin:30px 0 16px;
    opacity:0;transform:translateY(14px);animation:rise .5s .08s ease forwards;}
  .money-actions .ma{flex:1;background:var(--tile);color:#fff;border:0;font-family:var(--font);font-size:16px;font-weight:700;padding:16px;border-radius:32px;cursor:pointer;transition:.12s;}
  .money-actions .ma:active{transform:scale(.97);}
  .greencard{background:var(--tile2);border-radius:16px;padding:18px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:34px;cursor:pointer;
    opacity:0;transform:translateY(14px);animation:rise .5s .12s ease forwards;}
  .greencard .l{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:700;}
  .greencard .gi{width:22px;height:30px;border:2.5px solid var(--green);border-radius:5px;flex:0 0 auto;}
  .greencard .r{font-size:15px;font-weight:600;color:#fff;}
  .money h2{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:2px 0 14px;
    opacity:0;transform:translateY(14px);animation:rise .5s .16s ease forwards;}
  .promo{border-radius:20px;overflow:hidden;background:#131315;
    opacity:0;transform:translateY(14px);animation:rise .5s .2s ease forwards;}
  .promo .ptop{padding:20px 20px 4px;}
  .promo .pk{font-size:14px;font-weight:700;}
  .promo .ph{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin-top:6px;}
  .promo .pimg{height:150px;background:radial-gradient(circle at 60% 40%,#3a3a3d,#0e0e10 70%);position:relative;margin-top:8px;}
  .promo .pimg::after{content:"📱";position:absolute;right:40px;bottom:20px;font-size:80px;filter:grayscale(.3);}
  .promo .smiley2{position:absolute;right:34px;bottom:78px;width:34px;height:34px;border-radius:50%;background:#ffe14d;display:flex;align-items:center;justify-content:center;font-size:18px;}

  /* ============ ACTIVITY ============ */
  .activity{padding:6px 22px 100px;}
  .amonth{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:16px 0 10px;
    opacity:0;transform:translateY(14px);animation:rise .5s ease forwards;}
  .arow{display:flex;align-items:center;gap:14px;padding:12px 0;
    opacity:0;transform:translateY(14px);animation:rise .5s ease forwards;}
  .arow .av{width:52px;height:52px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;overflow:hidden;}
  .arow .mid{flex:1;min-width:0;}
  .arow .nm{font-size:17px;font-weight:700;}
  .arow .sub{font-size:14px;color:var(--muted);margin-top:2px;line-height:1.35;}
  .arow .amt{font-size:17px;font-weight:700;white-space:nowrap;}
  .arow .amt.pos{color:#fff;}
  .arow .amt.ref{color:#6a6a6e;text-decoration:line-through;}
  .adiv{height:1px;background:var(--line);margin:14px 0;}
  .invite{display:flex;align-items:center;gap:14px;padding:6px 0;cursor:pointer;}
  .invite .plus{width:52px;height:52px;border-radius:50%;border:1.5px solid #3a3a3d;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:300;flex:0 0 auto;}
  .invite .mid{flex:1;}
  .invite .nm{font-size:17px;font-weight:700;}
  .invite .sub{font-size:14px;color:var(--muted);margin-top:2px;}
  .invite .chev{width:10px;height:18px;stroke:#8a8a8e;fill:none;stroke-width:2.2;}

  /* ============ floating pill nav ============ */
  .nav{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:rgba(28,28,30,.92);backdrop-filter:blur(16px);border-radius:34px;padding:8px;z-index:20;}
  .nav .nb{width:76px;height:48px;border-radius:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;}
  .nav .nb svg{width:26px;height:26px;stroke:#8a8a8e;fill:none;stroke-width:2;}
  .nav .nb.on{background:#000;}
  .nav .nb.on svg{stroke:#fff;}

  body.editing [data-edit]{outline:1.5px dashed var(--green);outline-offset:3px;border-radius:4px;cursor:text;}
  [data-edit]:focus{outline:1.5px solid var(--green);}
  .hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:#666;font-size:12px;}
</style>

<body>

<div class="phone">
  <div class="statusbar">
    <span>11:24</span>
    <span class="right">
      <span class="signal"><b></b><b></b><b></b><b></b></span>
      <svg width="18" height="14" viewBox="0 0 18 14" fill="none"><path d="M9 3C11.5 3 13.8 4 15.5 5.6M9 7C10.4 7 11.7 7.6 12.7 8.5M4.3 5.6C6 4 8.3 3 9 3M6.3 8.5C7.3 7.6 8 7.4 9 7.4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="9" cy="11" r="1.2" fill="#fff"/></svg>

  <!-- shared top bar -->
  <div class="topbar">

    <div class="rgt">
      <div class="cir" id="qrBtn" title="Scan"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="14" width="5" height="5" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><path d="M14 13h3v3M20 13v7M14 20h3" stroke-linecap="round"/></svg></div>

  </div>

  <!-- floating pill nav -->
  <div class="nav">
    <div class="nb" data-tab="money" title="Money"><svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18" stroke-linecap="round"/></svg></div>
    <div class="nb on" data-tab="pay" title="Pay"><svg viewBox="0 0 24 24"><path d="M12 3v18M8.5 7.5c0-1.7 1.6-2.5 3.5-2.5s3.5.8 3.5 2.5S13.9 10 12 10.5 8.5 12 8.5 14 10.1 16.5 12 16.5s3.5-.8 3.5-2.5" stroke-linecap="round"/></svg></div>

  </div>

<div class="hint">Tap the keypad to enter an amount · Nav: Money · Pay · Activity · Toggle Edit</div>

<script>
/* ============================================================
   DATA — edit freely.
   ============================================================ */
const DEFAULT_DATA = {
  balance:"0.00",
  addLabel:"Add money", withdrawLabel:"Withdraw",
  greenTitle:"Cash App Green", greenRight:"Earn status",
  promoKicker:"Cash App Mobile", promoHead:"Unlimited data for $40/month",
  activity:[
    {month:"August 2024", rows:[
      {name:"Riley Foster", sub:"Payment", date:"Aug 1, 2024 · Refunded", amt:"+ $30", kind:"ref", av:"RF", bg:"linear-gradient(160deg,#3a5a8a,#2a6a5a)"},
    ]},
    {month:"July 2024", rows:[
      {name:"Riley Foster", sub:"video game crate", date:"Jul 25, 2024", amt:"$60", kind:"pos", av:"RF", bg:"linear-gradient(160deg,#3a5a8a,#2a6a5a)"},
      {name:"Add money", sub:"Chase Bank", date:"Jul 25, 2024", amt:"+ $60", kind:"pos", av:"$", bg:"#00D632", avColor:"#00230a"},
    ]},
  ],
};
const KEY="cashapp-dash-v2";
let DATA=load();
function load(){try{const s=localStorage.getItem(KEY);if(s)return{...structuredClone(DEFAULT_DATA),...JSON.parse(s)};}catch(e){}return structuredClone(DEFAULT_DATA);}
function save(){localStorage.setItem(KEY,JSON.stringify(DATA));}
function editing(){return document.body.classList.contains("editing");}

/* ---- keypad ---- */
const KEYS=["1","2","3","4","5","6","7","8","9",".","0","del"];
let entry="";
function renderPad(){
  const pad=document.getElementById("pad");pad.innerHTML="";
  KEYS.forEach(k=>{
    const d=document.createElement("div");d.className="key";
    if(k==="del"){d.innerHTML=`<svg viewBox="0 0 24 24"><path d="M9 6h11v12H9l-6-6z" stroke-linejoin="round"/><path d="M13 10l4 4M17 10l-4 4" stroke-linecap="round"/></svg>`;}
    else d.textContent=k;
    d.addEventListener("click",()=>{if(editing())return;pressKey(k);});
    pad.appendChild(d);
  });
}
function pressKey(k){
  if(k==="del"){entry=entry.slice(0,-1);}
  else if(k==="."){if(!entry.includes("."))entry=(entry||"0")+".";}
  else{
    if(entry.includes(".")&&entry.split(".")[1].length>=2)return; // max 2 decimals
    if(entry.replace(".","").length>=7)return;                    // sane cap
    entry=(entry==="0"?"":entry)+k;
  }
  const el=document.getElementById("amt");
  el.textContent="$"+(entry===""?"0":entry);
}

/* ---- activity ---- */
function renderActivity(){
  const el=document.getElementById("activityBody");el.innerHTML="";
  let idx=0;
  DATA.activity.forEach((grp,gi)=>{
    const h=document.createElement("div");h.className="amonth";h.style.animationDelay=(idx*40)+"ms";h.textContent=grp.month;el.appendChild(h);idx++;
    grp.rows.forEach((r,ri)=>{
      const row=document.createElement("div");row.className="arow";row.style.animationDelay=(idx*40)+"ms";idx++;
      row.innerHTML=`<span class="av" style="background:${r.bg};color:${r.avColor||'#fff'}">${r.av}</span>
        <div class="mid"><div class="nm">${r.name}</div><div class="sub">${r.sub}<br>${r.date}</div></div>
        <div class="amt ${r.kind}">${r.amt}</div>`;
      el.appendChild(row);
    });
  });
  const div=document.createElement("div");div.className="adiv";el.appendChild(div);
  const inv=document.createElement("div");inv.className="invite";
  inv.innerHTML=`<span class="plus">+</span><div class="mid"><div class="nm">Invite friends</div><div class="sub">Get $5</div></div>
    <svg class="chev" viewBox="0 0 12 20"><path d="M2 2l8 8-8 8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  el.appendChild(inv);
}

/* ---- editing ---- */
function bindEdits(){
  document.querySelectorAll("[data-edit]").forEach(el=>{
    el.setAttribute("contenteditable",editing());
    el.oninput=()=>{DATA[el.getAttribute("data-edit")]=el.textContent;save();};
  });
}
document.getElementById("editBtn").addEventListener("click",function(){
  const on=document.body.classList.toggle("editing");
  this.classList.toggle("on",on);this.textContent=on?"✓ Done":"✎ Edit";bindEdits();
});
document.getElementById("resetBtn").addEventListener("click",()=>{
  if(confirm("Reset this dashboard to its original values?")){
    localStorage.removeItem(KEY);DATA=structuredClone(DEFAULT_DATA);
    entry="";document.getElementById("amt").textContent="$0";
    renderActivity();restoreScalars();bindEdits();
  }
});
function restoreScalars(){
  document.querySelectorAll("[data-edit]").forEach(el=>{
    const k=el.getAttribute("data-edit");if(DATA[k]!==undefined)el.textContent=DATA[k];
  });
}

/* ---- router ---- */
function showTab(name){
  document.querySelectorAll(".ca-view").forEach(v=>v.classList.toggle("on",v.dataset.view===name));
  document.querySelectorAll(".nb").forEach(b=>b.classList.toggle("on",b.dataset.tab===name));
  document.getElementById("qrBtn").style.display=(name==="pay")?"flex":"none";
  document.getElementById("screen").scrollTop=0;
  bindEdits();
}
document.querySelectorAll(".nb").forEach(b=>{
  b.addEventListener("click",()=>{if(!editing())showTab(b.dataset.tab);});
});

renderPad();renderActivity();restoreScalars();bindEdits();
</script>
