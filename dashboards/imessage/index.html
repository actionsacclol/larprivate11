<!DOCTYPE html>
<html lang="en" data-krypt-status="translucent">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>iMessage · Learning Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     iMESSAGE — a learning recreation (TEST demo).

     One conversation thread, dark mode. The lesson is the chat
     pattern, which nothing else in the collection covers: runs of
     consecutive bubbles, tails on only the last of a run, read
     receipts, a typing indicator, a composer that sends, and a
     working keyboard.

     Two bits of CSS worth knowing about:

     1. TAILS. Each is two pseudo-elements — ::before is a rounded
        square of bubble colour poking past the bubble's corner,
        ::after is a rounded square of *screen* colour that masks it
        back into a curve. Both sit outside the padding box so they
        never touch the text. The mask colour must match --bg; if the
        thread background changes, change it in both places.

     2. THE FLOATING NAV. The controls are glass pills over a
        transparent bar and the thread scrolls *underneath* them, so
        .screen is absolutely positioned inside .stage with enough
        top padding to clear the pills at rest.

     Type in the composer and press send: your bubble appends, the
     receipt follows it down, and the other side types back. The +
     button toggles that auto-reply off when you want to stage a
     screenshot. Tapping the field raises the keyboard, which types.

     Data-driven — see DEFAULT_DATA. Edit toggle = click any bubble,
     the contact name, the badge or the time; saved to your browser.
     ============================================================ */
  :root{
    --blue:#2D8CFF;          /* sent bubble — iMessage runs lighter than systemBlue */
    --gray:#2C2C2E;          /* received bubble — iOS systemGray5 (dark) */
    --bg:#000000;            /* thread background — tail masks match this */
    --chip:rgba(58,58,60,.72);   /* the floating glass controls */
    --key:#4A4A4C;
    --keymod:#2C2C2E;
    --text:#FFFFFF;
    --muted:#8E8E93;         /* iOS secondary label */
    --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#0a0a0a;font-family:var(--font);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;-webkit-font-smoothing:antialiased;}

  .back{position:fixed;top:18px;left:18px;z-index:50;background:#1c1c1e;color:#fff;border:1px solid #333;text-decoration:none;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;font-family:var(--font);transition:.15s;}
  .back:hover{background:#2a2a2c;}
  .toolbar{position:fixed;top:18px;right:18px;display:flex;gap:8px;z-index:50;}
  .toolbar button{background:#1c1c1e;color:#fff;border:1px solid #333;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:.15s;}
  .toolbar button:hover{background:#2a2a2c;}
  .toolbar button.on{background:var(--blue);color:#fff;border-color:var(--blue);}

  .phone{position:relative;width:390px;max-width:100%;height:844px;background:var(--bg);border-radius:44px;box-shadow:0 0 0 12px #111,0 40px 90px rgba(0,0,0,.7);overflow:hidden;display:flex;flex-direction:column;}

  .statusbar{display:flex;align-items:center;justify-content:space-between;padding:15px 30px 4px;font-size:15px;font-weight:600;flex:0 0 auto;position:relative;z-index:8;}
  .statusbar .right{display:flex;align-items:center;gap:7px;}
  .battery{border:1.5px solid rgba(255,255,255,.45);border-radius:4px;width:26px;height:13px;position:relative;display:flex;align-items:center;padding:1.5px;}
  .battery::after{content:"";position:absolute;right:-4px;top:4px;width:2px;height:5px;background:rgba(255,255,255,.45);border-radius:0 2px 2px 0;}
  .battery i{display:block;height:100%;background:#fff;border-radius:1.5px;width:88%;}
  .signal{display:flex;align-items:flex-end;gap:2px;height:12px;}
  .signal b{width:3px;background:#fff;border-radius:1px;display:block;}
  .signal b:nth-child(1){height:5px}.signal b:nth-child(2){height:7px}.signal b:nth-child(3){height:9px}.signal b:nth-child(4){height:12px;opacity:.35}

  /* ---- stage: the thread, with the nav floating over it ---- */
  .stage{position:relative;flex:1;min-height:0;}

  .screen{
    position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
    padding:112px 14px 12px;display:flex;flex-direction:column;
  }
  .screen::-webkit-scrollbar{display:none;}
  /* A short conversation sits at the bottom, the way a real thread
     does. margin-top:auto beats justify-content:flex-end, which breaks
     scrolling back to the top once the thread outgrows the screen. */
  .thread{margin-top:auto;}

  /* ---- floating glass nav ---- */
  .nav{
    position:absolute;top:0;left:0;right:0;z-index:6;
    display:flex;align-items:flex-start;justify-content:space-between;
    padding:6px 12px 0;pointer-events:none;
  }
  .nav>*{pointer-events:auto;}
  .glass{
    background:var(--chip);-webkit-backdrop-filter:blur(22px) saturate(180%);
    backdrop-filter:blur(22px) saturate(180%);border-radius:999px;
  }
  .navback{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 9px;cursor:pointer;min-width:62px;}
  .navback svg{width:12px;height:20px;stroke:#fff;fill:none;stroke-width:2.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;}
  .navback .badge{
    background:rgba(142,142,147,.55);border-radius:999px;padding:2px 9px;
    font-size:14px;font-weight:600;letter-spacing:-.2px;line-height:1.35;
  }
  .navcall{width:41px;height:41px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .navcall svg{width:23px;height:23px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linejoin:round;}

  .who{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;margin-top:-2px;}
  .who .av{
    width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:24px;font-weight:600;letter-spacing:.3px;flex:0 0 auto;
    box-shadow:0 2px 10px rgba(0,0,0,.5);
  }
  .who .nm{
    display:flex;align-items:center;gap:4px;padding:4px 11px;
    font-size:14px;font-weight:700;letter-spacing:.1px;max-width:172px;
  }
  .who .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .who .nm svg{width:7px;height:11px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;opacity:.75;}

  /* ---- thread ---- */
  .tstamp{
    text-align:center;font-size:12px;font-weight:400;color:var(--muted);
    margin:18px 0 12px;letter-spacing:-.05px;
    opacity:0;animation:pop .34s ease forwards;
  }
  .tstamp b{font-weight:600;color:#C7C7CC;}

  .row{display:flex;margin-top:2px;opacity:0;animation:pop .34s cubic-bezier(.2,.8,.3,1) forwards;}
  .row.them{justify-content:flex-start;}
  .row.me{justify-content:flex-end;}
  .row.start{margin-top:9px;}   /* gap between runs, not inside one */
  @keyframes pop{from{opacity:0;transform:translateY(9px) scale(.94);}to{opacity:1;transform:none;}}

  .b{
    position:relative;max-width:74%;padding:9px 16px 10px;border-radius:20px;
    font-size:17px;line-height:1.29;letter-spacing:-.3px;
    word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;
  }
  .them .b{background:var(--gray);color:#fff;}
  .me .b{background:var(--blue);color:#fff;}

  .row.tail .b::before,.row.tail .b::after{content:"";position:absolute;bottom:0;height:22px;}
  .row.tail.them .b::before{left:-8px;width:22px;background:var(--gray);border-bottom-right-radius:18px;}
  .row.tail.them .b::after{left:-28px;width:28px;background:var(--bg);border-bottom-right-radius:12px;}
  .row.tail.me .b::before{right:-8px;width:22px;background:var(--blue);border-bottom-left-radius:18px;}
  .row.tail.me .b::after{right:-28px;width:28px;background:var(--bg);border-bottom-left-radius:12px;}

  .receipt{
    text-align:right;font-size:11.5px;font-weight:400;color:var(--muted);
    margin:4px 4px 0;letter-spacing:-.1px;
  }
  .receipt b{font-weight:700;color:#AEAEB2;}

  /* ---- typing indicator ---- */
  .typing{display:none;}
  .typing.on{display:flex;}
  .dots{background:var(--gray);border-radius:19px;padding:14px 16px;display:flex;gap:5px;}
  .dots i{width:9px;height:9px;border-radius:50%;background:#8A8A8E;display:block;animation:blink 1.35s infinite;}
  .dots i:nth-child(2){animation-delay:.22s;}
  .dots i:nth-child(3){animation-delay:.44s;}
  @keyframes blink{0%,60%,100%{opacity:.42;transform:scale(.86);}30%{opacity:1;transform:scale(1);}}

  /* ---- composer ---- */
  .composer{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:9px 13px 10px;background:var(--bg);}
  .plus{
    width:37px;height:37px;border-radius:50%;background:#1C1C1E;border:0;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;
  }
  .plus svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.3;stroke-linecap:round;}
  .plus:hover{background:#2a2a2c;}
  /* The real composer's + is a plain dark circle, so that is the resting
     look. Auto-reply being OFF is the unusual state, so that is what gets
     marked — a small amber dot rather than repainting the whole button. */
  .plus{position:relative;}
  .plus.off::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;
    border-radius:50%;background:#FFD400;border:2px solid var(--bg);}

  .field{
    flex:1;min-width:0;display:flex;align-items:center;gap:7px;
    border:1px solid #3A3A3C;border-radius:20px;padding:6px 7px 6px 15px;background:var(--bg);
  }
  .field input{
    flex:1;min-width:0;border:0;outline:0;background:transparent;
    font-family:var(--font);font-size:17px;letter-spacing:-.3px;color:#fff;padding:3px 0;
  }
  .field input::placeholder{color:#68686D;}
  .mic{width:22px;height:22px;flex:0 0 auto;stroke:#8E8E93;fill:none;stroke-width:1.9;stroke-linecap:round;}
  .send{
    width:29px;height:29px;border-radius:50%;background:var(--blue);border:0;flex:0 0 auto;
    display:none;align-items:center;justify-content:center;cursor:pointer;
  }
  .send svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
  .field.has .send{display:flex;animation:pop .18s cubic-bezier(.2,.8,.3,1);}
  .field.has .mic{display:none;}

  /* ---- keyboard: raised while the field has focus ---- */
  .kb{
    flex:0 0 auto;background:#1C1C1E;padding:7px 3px 0;
    max-height:0;overflow:hidden;transition:max-height .26s cubic-bezier(.3,.8,.35,1);
  }
  .kb.up{max-height:300px;}
  .krow{display:flex;gap:6px;justify-content:center;margin-bottom:11px;padding:0 3px;}
  .krow.r2{padding:0 22px;}
  .key{
    flex:1;height:42px;border-radius:5px;background:var(--key);color:#fff;border:0;
    font-family:var(--font);font-size:22px;font-weight:400;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 0 rgba(0,0,0,.55);transition:background .08s;
  }
  .key:active{background:#6a6a6e;}
  .key.mod{background:var(--keymod);flex:1.5;font-size:15px;font-weight:500;}
  .key.mod:active{background:#3d3d40;}
  .key.mod.on{background:#E6E6EA;color:#000;}
  .key.mod svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .key.wide{flex:4.6;font-size:15px;}
  .key.go{flex:2.1;background:var(--keymod);font-size:15px;font-weight:500;}
  .kbfoot{display:flex;align-items:center;justify-content:space-between;padding:2px 22px 8px;}
  .kbfoot svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.92;}

  .homebar{flex:0 0 auto;display:flex;justify-content:center;padding:8px 0 10px;background:var(--bg);}
  .kb.up+.homebar{background:#1C1C1E;}
  .homebar i{width:138px;height:5px;border-radius:3px;background:#fff;opacity:.9;display:block;}

  /* ============ + menu and the Apple Cash flow ============
     Three surfaces, all absolutely positioned inside .phone so they
     stay on the mock rather than the page: the attachment sheet, the
     amount panel, and the full keypad. Each slides up over the
     composer, and only one is ever open. */
  .scrim{position:absolute;inset:0;z-index:28;background:rgba(0,0,0,.45);
    opacity:0;pointer-events:none;transition:opacity .22s ease;}
  .scrim.on{opacity:1;pointer-events:auto;}

  .sheet{
    position:absolute;left:10px;bottom:8px;z-index:30;width:270px;
    background:rgba(38,38,42,.92);-webkit-backdrop-filter:blur(28px) saturate(180%);
    backdrop-filter:blur(28px) saturate(180%);border-radius:22px;overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.6);
    transform:translateY(14px) scale(.94);transform-origin:left bottom;
    opacity:0;pointer-events:none;transition:.24s cubic-bezier(.2,.9,.3,1.05);
  }
  .sheet.on{transform:none;opacity:1;pointer-events:auto;}
  .srow{display:flex;align-items:center;gap:16px;padding:11px 18px;cursor:pointer;
    font-size:19px;letter-spacing:-.3px;}
  .srow:active{background:rgba(255,255,255,.07);}
  .srow .si{width:38px;height:38px;border-radius:50%;flex:none;display:flex;
    align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;}
  .srow .tog{margin-left:auto;font-size:13px;font-weight:600;color:#8E8E93;}
  .srow.on .tog{color:#30D158;}

  /* the amount panel — minus, big figure, plus */
  .pay{
    position:absolute;left:0;right:0;bottom:0;z-index:30;background:#1C1C1E;
    border-radius:14px 14px 0 0;padding:10px 18px 22px;
    transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.9,.3,1.02);
  }
  .pay.on{transform:none;}
  .grab{width:38px;height:5px;border-radius:3px;background:#48484A;margin:0 auto 18px;}
  .amtrow{display:flex;align-items:center;justify-content:center;gap:34px;}
  .rnd{width:56px;height:56px;border-radius:50%;border:0;background:#2C2C2E;color:#fff;
    font:300 30px/1 var(--font);cursor:pointer;flex:none;}
  .rnd:active{background:#3A3A3C;}
  /* the chrome numeral Apple Cash uses */
  .bigamt{
    font-size:62px;font-weight:700;letter-spacing:-2px;line-height:1.1;
    background:linear-gradient(120deg,#FFFFFF 8%,#9A9A9E 30%,#FFFFFF 52%,#8E8E93 74%,#EFEFEF 94%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-fill-color:transparent;white-space:nowrap;
  }
  .showkp{text-align:center;color:#8E8E93;font-size:15px;margin-top:14px;cursor:pointer;}
  .payacts{display:flex;gap:12px;margin-top:26px;}
  .payacts button{flex:1;border:0;border-radius:14px;padding:15px;background:#2C2C2E;
    color:#fff;font:600 17px/1 var(--font);cursor:pointer;}
  .payacts button:active{background:#3A3A3C;}

  /* the full keypad sheet */
  .kpay{
    position:absolute;inset:0;z-index:31;background:#1C1C1E;border-radius:14px 14px 0 0;
    padding:12px 22px 20px;display:flex;flex-direction:column;text-align:center;
    transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.9,.3,1.02);
  }
  .kpay.on{transform:none;}
  .kpay .bigamt{margin-top:52px;font-size:74px;}
  .balance{color:#8E8E93;font-size:15px;margin-top:14px;}
  .kpgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 22px;
    margin:auto 0;padding:0 26px;}
  .kpgrid button{aspect-ratio:1;border:0;border-radius:50%;background:#2C2C2E;color:#fff;
    font:400 30px/1 var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .kpgrid button:active{background:#3A3A3C;}
  .kpgrid button svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;}
  .recur{color:#fff;font-size:17px;font-weight:600;margin:8px 0 16px;}

  /* the composer turns into a pending Apple Cash card before sending */
  .paycard{
    display:none;flex:1;min-width:0;border:1px solid #3A3A3C;border-radius:18px;
    background:#1C1C1E;padding:10px 12px 8px;
  }
  .composer.paying .paycard{display:block;}
  .composer.paying .field{display:none;}
  .pchead{display:flex;align-items:center;justify-content:space-between;}
  .pclogo{font-size:15px;font-weight:600;letter-spacing:-.2px;}
  .aplg{width:13px;height:13px;vertical-align:-2px;margin-right:1px;}
  .pcx{width:24px;height:24px;border-radius:50%;border:0;background:#3A3A3C;color:#C7C7CC;
    font:600 12px/1 var(--font);cursor:pointer;}
  .paycard .bigamt{font-size:46px;text-align:center;margin:10px 0 12px;}
  .pcfoot{display:flex;align-items:center;gap:8px;border-top:1px solid #3A3A3C;padding-top:8px;}
  .pcfoot input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;
    font:400 16px var(--font);}
  .pcfoot input::placeholder{color:#68686D;}
  .pcsend{width:32px;height:32px;border-radius:50%;border:0;background:#fff;color:#000;
    cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;}
  .pcsend svg{width:18px;height:18px;stroke:#000;fill:none;stroke-width:2.6;
    stroke-linecap:round;stroke-linejoin:round;}

  /* a sent payment, rendered like an attachment rather than a text bubble */
  .paymsg{
    position:relative;width:210px;border-radius:18px;background:#1C1C1E;
    border:1px solid #3A3A3C;padding:11px 13px 16px;
  }
  .paymsg .pl{font-size:14px;font-weight:600;letter-spacing:-.2px;}
  .paymsg .bigamt{font-size:44px;text-align:center;margin:8px 0 2px;}
  .paymsg .ps{text-align:center;color:#8E8E93;font-size:12px;}

  /* ---- editing ----
     Every control below exists in the DOM at all times and is only
     revealed by body.editing, so the thread itself stays clean and
     nothing has to be rebuilt when the toggle flips. */
  body.editing [data-edit],body.editing [data-msg],body.editing [data-div],body.editing [data-pay-amt]{
    outline:1.5px dashed var(--blue);outline-offset:3px;border-radius:4px;cursor:text;}
  [data-edit]:focus,[data-msg]:focus,[data-div]:focus{outline:1.5px solid var(--blue);}

  /* per-message controls, aligned to the same side as their bubble */
  .ctl{display:none;gap:5px;margin:5px 2px 2px;}
  body.editing .ctl{display:flex;}
  .ctl.them{justify-content:flex-start;}
  .ctl.me{justify-content:flex-end;}
  .ctl button{
    width:25px;height:25px;border-radius:7px;border:1px solid #3A3A3C;background:#1C1C1E;
    color:#C7C7CC;font:600 12px/1 var(--font);cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.12s;
  }
  .ctl button:hover{background:#2C2C2E;color:#fff;border-color:#4a4a4c;}
  .ctl button.danger:hover{background:#FF453A;border-color:#FF453A;color:#fff;}
  .ctl button:disabled{opacity:.3;cursor:default;}
  .ctl button:disabled:hover{background:#1C1C1E;color:#C7C7CC;border-color:#3A3A3C;}

  /* add-a-bubble bar, at the end of the thread */
  .addbar{display:none;gap:7px;flex-wrap:wrap;justify-content:center;margin:18px 0 6px;}
  body.editing .addbar{display:flex;}
  .addbar button{
    border:1px solid #3A3A3C;background:#1C1C1E;color:#fff;border-radius:999px;
    padding:8px 14px;font:600 12.5px var(--font);cursor:pointer;transition:.12s;
  }
  .addbar button:hover{background:#2C2C2E;border-color:#4a4a4c;}
  .addbar button.blue{background:var(--blue);border-color:var(--blue);}
  .addbar button.blue:hover{background:#2b96ff;}

  body.editing .composer,body.editing .kb{opacity:.4;pointer-events:none;}

  .hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:#666;font-size:12px;text-align:center;}
</style>

<body>

<a class="back" href="../../index.html">← Collection</a>
<div class="toolbar">
  <button id="editBtn">✎ Edit</button>
  <button id="resetBtn">↺ Reset</button>
</div>

<div class="phone">
  <div class="statusbar">
    <span data-edit="clock">9:53</span>
    <span class="right">
      <span class="signal"><b></b><b></b><b></b><b></b></span>

  <div class="stage">

      <!-- inputmode="none" is the whole reason this screen doesn't end up

      <input id="input" type="text" inputmode="none" placeholder="iMessage" autocomplete="off"

    <!-- swapped in for the text field once an amount is staged -->

      <div class="pchead"><span class="pclogo"><svg class="aplg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.3 12.6c0-2.1 1.7-3.1 1.8-3.2-1-1.4-2.5-1.6-3-1.7-1.3-.1-2.5.8-3.1.8-.6 0-1.6-.7-2.7-.7-1.4 0-2.7.8-3.4 2.1-1.5 2.5-.4 6.3 1 8.4.7 1 1.6 2.2 2.7 2.11.1 0 1.5-.7 2.8-.7s1.7.7 2.8.7c1.2 0 1.9-1 2.6-2.1.8-1.2 1.2-2.3 1.2-2.4-.1 0-2.3-.9-2.3-3.4zM14.2 6.3c.6-.7 1-1.7.9-2.7-.9 0-1.9.6-2.5 1.3-.5.6-1 1.6-.9 2.6 1 .1 2-.5 2.5-1.2z"/></svg>Cash</span>

               autocomplete="off" spellcheck="false" aria-label="Comment">

      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.6 3.8 9S14.5 18.5 12 21c-2.5-2.5-3.8-5.6-3.8-9S9.5 5.5 12 3z"/></svg>
      <svg viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0013 0M12 18v3"/></svg>
    </div>
  </div>


  <!-- everything the + button opens, over the thread but inside the frame -->
  <div class="scrim" id="scrim"></div>

  <div class="sheet" id="sheet">
    <div class="srow" data-att="camera"><span class="si" style="background:linear-gradient(160deg,#8E8E93,#3A3A3C)">◉</span>Camera</div>
    <div class="srow" data-att="photos"><span class="si" style="background:#fff;color:#FF375F">✿</span>Photos</div>
    <div class="srow" data-att="stickers"><span class="si" style="background:linear-gradient(160deg,#C7B9FF,#7BA7FF)">◗</span>Stickers</div>
    <div class="srow" data-att="cash"><span class="si" style="background:#2C2C2E">$</span>Apple Cash</div>
    <div class="srow" data-att="polls"><span class="si" style="background:#FFC83D;color:#7A5A00">≡</span>Polls</div>
    <div class="srow" data-att="later"><span class="si" style="background:#0A84FF">◷</span>Send Later</div>
    <div class="srow" data-att="audio"><span class="si" style="background:#FF453A">♪</span>Audio</div>
    <div class="srow" id="arRow" data-att="autoreply"><span class="si" style="background:#2C2C2E">↻</span>Auto-reply<span class="tog">On</span></div>
  </div>

  <div class="pay" id="payPanel">
    <div class="grab"></div>
    <div class="amtrow">
      <button class="rnd" type="button" data-step="-1">−</button>
      <div class="bigamt" id="payAmt">$1</div>
      <button class="rnd" type="button" data-step="1">+</button>
    </div>
    <div class="showkp" id="showKp">Show Keypad</div>
    <div class="payacts">
      <button type="button" data-pay="request">Request</button>
      <button type="button" data-pay="send">Send</button>
    </div>
  </div>

  <div class="kpay" id="payKeypad">
    <div class="grab"></div>
    <div class="bigamt" id="kpAmt">$1</div>
    <div class="balance">Apple Cash Balance: <span data-edit="cashBalance">$0.00</span></div>
    <div class="kpgrid" id="kpGrid"></div>
    <div class="recur">Send Recurring Payment</div>
    <div class="payacts">
      <button type="button" data-pay="request">Request</button>
      <button type="button" data-pay="send">Send</button>
    </div>
  </div>
  <div class="homebar"><i></i></div>
</div>

<div class="hint">Tap <b>+</b> for attachments and Apple Cash · tap the field for the keyboard · Toggle Edit to rewrite the thread</div>

<script>
/* ============================================================
   DATA — edit freely.

   `thread` is a flat list in display order. An item is either a
   divider ({t:"..."}) or a message ({from:"them"|"me", text,
   receipt?}). Runs of the same sender are grouped at render time;
   only the last bubble of a run gets a tail. A `receipt` on a "me"
   message prints under it — that's how "Read 10:24 AM" lands mid-
   thread rather than only at the very end.
   ============================================================ */
const DEFAULT_DATA = {
  contact:"Jordan Reyes",
  initials:"JR",
  avatar:"linear-gradient(160deg,#6E6A8A,#413E58)",
  clock:"9:41",
  unread:"12",
  receipt:"Delivered",
  cashBalance:"$0.00",
  autoReply:true,
  // Fictional placeholder conversation. It's arranged to show every
  // feature at least once: a three-bubble run, a mid-thread
  // receipt, and a date divider.
  thread:[
    {from:"them", text:"did you get the photos I sent over"},
    {from:"them", text:"the light that morning was unreal"},
    {from:"them", text:"worth the early start"},
    {from:"me",   text:"they came out great", receipt:"<b>Read</b> 10:24 AM"},
    {from:"them", text:"printing the second one this week"},
    {from:"them", text:"what are you up to later"},
    {t:"<b>Today</b> 2:03 PM"},
    {from:"me",   text:"finishing up some work"},
    {from:"me",   text:"free after six"},
  ],
  replies:[
    "haha ok","wait really?","omw","one sec","sounds good","bet",
    "😂","i'll let you know","for sure","ok that's actually wild",
    "👍","yeah that works","lol","fr","perfect",
  ],
};

const KEY="imessage-dash-v1";
let DATA=load();
function load(){try{const s=localStorage.getItem(KEY);if(s)return{...structuredClone(DEFAULT_DATA),...JSON.parse(s)};}catch(e){}return structuredClone(DEFAULT_DATA);}
function save(){localStorage.setItem(KEY,JSON.stringify(DATA));}
function editing(){return document.body.classList.contains("editing");}

const screenEl=document.getElementById("screen");
const inputEl=document.getElementById("input");
const fieldEl=document.getElementById("field");
const plusBtn=document.getElementById("plusBtn");
const kbEl=document.getElementById("kb");

/* Dividers and receipts ship with a little markup in DEFAULT_DATA (the
   bold day, the bold "Read"). Once you edit one it becomes your plain
   text and is set as text from then on — so nothing you type is ever
   parsed as markup. */
function setRich(el,value,plain){
  if(plain)el.textContent=value; else el.innerHTML=value;
}

/* The row of edit affordances that sits under every thread item. */
function controls(i,side){
  const c=document.createElement("div");
  c.className="ctl "+side;
  const isDivider=DATA.thread[i].t!==undefined;
  const defs=[
    ["side","⇄","Swap side",isDivider],
    ["up","↑","Move up",i===0],
    ["down","↓","Move down",i===DATA.thread.length-1],
    ["del","✕","Delete",false],
  ];
  for(const [act,glyph,title,off] of defs){
    const b=document.createElement("button");
    b.type="button";b.dataset.act=act;b.dataset.i=i;
    b.textContent=glyph;b.title=title;
    if(act==="del")b.className="danger";
    if(off)b.disabled=true;
    c.appendChild(b);
  }
  return c;
}

function addBar(){
  const bar=document.createElement("div");
  bar.className="addbar";
  bar.innerHTML=
    '<button type="button" data-add="them">+ Their bubble</button>'+
    '<button type="button" data-add="me" class="blue">+ Your bubble</button>'+
    '<button type="button" data-add="time">+ Timestamp</button>';
  return bar;
}

/* One delegated listener for every control — the thread is rebuilt on
   each change, so per-button listeners would just be garbage. */
screenEl.addEventListener("click",e=>{
  const add=e.target.closest("[data-add]");
  if(add){
    const kind=add.dataset.add;
    DATA.thread.push(kind==="time"
      ? {t:"Today 2:03 PM", plain:true}
      : {from:kind, text:kind==="me"?"Your message":"Their message"});
    save();renderThread(false);bindEdits();
    // Drop the caret straight into the new bubble so you can just type.
    const fresh=screenEl.querySelector('[data-msg="'+(DATA.thread.length-1)+'"]')
             || screenEl.querySelector('[data-div="'+(DATA.thread.length-1)+'"]');
    if(fresh){fresh.focus();document.getSelection()?.selectAllChildren(fresh);}
    toBottom(true);
    return;
  }

  const btn=e.target.closest("[data-act]");
  if(!btn)return;
  const i=+btn.dataset.i, item=DATA.thread[i];
  if(!item)return;

  switch(btn.dataset.act){
    case "side":  item.from = item.from==="me" ? "them" : "me"; break;
    case "up":    if(i>0)DATA.thread.splice(i-1,0,DATA.thread.splice(i,1)[0]); break;
    case "down":  if(i<DATA.thread.length-1)DATA.thread.splice(i+1,0,DATA.thread.splice(i,1)[0]); break;
    case "del":   DATA.thread.splice(i,1); break;
  }
  save();renderThread(false);bindEdits();
});

/* ---- render ---- */
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function renderThread(animate){
  screenEl.innerHTML="";
  // Everything goes in .thread, which margin-top:autos itself to the
  // bottom of .screen while the conversation is still short.
  const wrap=document.createElement("div");
  wrap.className="thread";
  screenEl.appendChild(wrap);
  let step=0;

  DATA.thread.forEach((item,i)=>{
    const delay=animate?Math.min(step*45,900):0;step++;

    if(item.t!==undefined){
      const d=document.createElement("div");
      d.className="tstamp";
      d.style.animationDelay=delay+"ms";
      d.setAttribute("data-div",i);
      setRich(d,item.t,item.plain);
      wrap.appendChild(d);
      wrap.appendChild(controls(i,"them"));
      return;
    }

    // A bubble ends a run when the next item isn't the same sender.
    const next=DATA.thread[i+1],prev=DATA.thread[i-1];
    const isTail=!next||next.t!==undefined||next.from!==item.from||item.receipt;
    const isStart=!prev||prev.t!==undefined||prev.from!==item.from||prev.receipt;

    const row=document.createElement("div");
    row.className="row "+item.from+(isTail?" tail":"")+(isStart?" start":"");
    row.style.animationDelay=delay+"ms";

    const b=document.createElement("div");
    if(item.pay!==undefined){
      // Apple Cash lands as an attachment card, not a text bubble.
      b.className="paymsg";
      b.innerHTML='<div class="pl"><svg class="aplg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.3 12.6c0-2.1 1.7-3.1 1.8-3.2-1-1.4-2.5-1.6-3-1.7-1.3-.1-2.5.8-3.1.8-.6 0-1.6-.7-2.7-.7-1.4 0-2.7.8-3.4 2.1-1.5 2.5-.4 6.3 1 8.4.7 1 1.6 2.2 2.7 2.11.1 0 1.5-.7 2.8-.7s1.7.7 2.8.7c1.2 0 1.9-1 2.6-2.1.8-1.2 1.2-2.3 1.2-2.4-.1 0-2.3-.9-2.3-3.4zM14.2 6.3c.6-.7 1-1.7.9-2.7-.9 0-1.9.6-2.5 1.3-.5.6-1 1.6-.9 2.6 1 .1 2-.5 2.5-1.2z"/></svg>Cash</div>'+
        '<div class="bigamt" data-pay-amt="'+i+'">'+esc(item.pay)+'</div>'+
        '<div class="ps">'+(item.kind==="request"?"Requested":"Paid")+'</div>';
    }else{
      b.className="b";
      b.setAttribute("data-msg",i);
      b.textContent=item.text;     // text as text — the thread is editable
    }
    row.appendChild(b);
    wrap.appendChild(row);

    // A mid-thread receipt, e.g. "Read 10:24 AM" under an earlier reply.
    if(item.receipt&&item.from==="me"){
      const r=document.createElement("div");
      r.className="receipt";r.setAttribute("data-div",i);r.dataset.field="receipt";
      setRich(r,item.receipt,item.receiptPlain);
      r.style.animationDelay=delay+"ms";
      wrap.appendChild(r);
    }

    wrap.appendChild(controls(i,item.from));
  });

  wrap.appendChild(addBar());

  // The trailing receipt belongs under the last bubble, and only if
  // you sent it and it isn't already carrying one of its own.
  const last=[...DATA.thread].reverse().find(m=>m.t===undefined);
  if(last&&last.from==="me"&&!last.receipt){
    const r=document.createElement("div");
    r.className="receipt";r.setAttribute("data-edit","receipt");
    r.textContent=DATA.receipt;
    wrap.appendChild(r);
  }

  const typing=document.createElement("div");
  typing.className="row them typing";typing.id="typing";
  typing.innerHTML='<div class="dots"><i></i><i></i><i></i></div>';
  wrap.appendChild(typing);

  toBottom();
}

function toBottom(smooth){
  requestAnimationFrame(()=>{
    screenEl.scrollTo({top:screenEl.scrollHeight,behavior:smooth?"smooth":"auto"});
  });
}

/* Re-play the entrance on just the newest bubble. Re-running the whole
   thread on every send would be seasick. */
function popLast(){
  const rows=screenEl.querySelectorAll(".row:not(.typing)");
  const r=rows[rows.length-1];
  if(!r)return;
  r.style.animation="none";void r.offsetWidth;
  r.style.animation="pop .34s cubic-bezier(.2,.8,.3,1) forwards";
}

/* ---- sending ---- */
let replyTimers=[];
function clearReply(){
  replyTimers.forEach(clearTimeout);replyTimers=[];
  document.getElementById("typing")?.classList.remove("on");
}

function send(){
  const text=inputEl.value.trim();
  if(!text||editing())return;
  DATA.thread.push({from:"me",text});
  save();
  inputEl.value="";fieldEl.classList.remove("has");
  renderThread(false);bindEdits();popLast();toBottom(true);

  if(!DATA.autoReply)return;
  clearReply();
  replyTimers.push(setTimeout(()=>{
    document.getElementById("typing")?.classList.add("on");toBottom(true);
  },700));
  replyTimers.push(setTimeout(()=>{
    document.getElementById("typing")?.classList.remove("on");
    const pool=DATA.replies&&DATA.replies.length?DATA.replies:["ok"];
    DATA.thread.push({from:"them",text:pool[Math.floor(Math.random()*pool.length)]});
    save();renderThread(false);bindEdits();popLast();toBottom(true);
  },2100));
}

function syncField(){fieldEl.classList.toggle("has",!!inputEl.value.trim());}
inputEl.addEventListener("input",syncField);
inputEl.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();send();}});
document.getElementById("sendBtn").addEventListener("click",send);

/* ============================================================
   THE + BUTTON — attachments, and the Apple Cash flow.

   Four surfaces, one open at a time: the attachment sheet, the amount
   panel, the keypad, and the staged card that replaces the text field.
   closeAll() is the only way any of them shut, so they can't stack.

   Only Apple Cash is wired up — Camera, Photos, Stickers, Polls, Send
   Later and Audio are in the sheet because the real one has them, and
   they just dismiss. Auto-reply moved here off the + button, which the
   real composer uses for exactly this menu.
   ============================================================ */
var payAmt = 1, kpBuf = "";

function fmtAmt(v){
  var n = Number(v) || 0;
  // whole dollars lose the decimals, the way Apple Cash shows them
  return "$" + (n % 1 === 0 ? String(n) : n.toFixed(2));
}
function paintAmt(){
  var t = fmtAmt(payAmt);
  document.getElementById("payAmt").textContent = t;
  document.getElementById("kpAmt").textContent = kpBuf ? "$" + kpBuf : t;
  document.getElementById("cardAmt").textContent = t;
}

function closeAll(){
  ["sheet","payPanel","payKeypad"].forEach(function(id){
    document.getElementById(id).classList.remove("on");
  });
  document.getElementById("scrim").classList.remove("on");
}
function openSheet(){
  if(editing()) return;
  kbEl.classList.remove("up");
  document.getElementById("arRow").classList.toggle("on", DATA.autoReply);
  document.getElementById("arRow").querySelector(".tog").textContent = DATA.autoReply ? "On" : "Off";
  document.getElementById("sheet").classList.add("on");
  document.getElementById("scrim").classList.add("on");
}
function openPay(){
  closeAll();
  kpBuf = ""; paintAmt();
  document.getElementById("payPanel").classList.add("on");
  document.getElementById("scrim").classList.add("on");
}
function openKeypad(){
  document.getElementById("payPanel").classList.remove("on");
  kpBuf = ""; paintAmt();
  document.getElementById("payKeypad").classList.add("on");
  document.getElementById("scrim").classList.add("on");
}

plusBtn.addEventListener("click", function(){
  if(document.getElementById("sheet").classList.contains("on")) { closeAll(); return; }
  openSheet();
});
document.getElementById("scrim").addEventListener("click", closeAll);

document.getElementById("sheet").addEventListener("click", function(e){
  var r = e.target.closest(".srow"); if(!r) return;
  var what = r.dataset.att;
  if(what === "cash"){ openPay(); return; }
  if(what === "autoreply"){
    DATA.autoReply = !DATA.autoReply; save();
    plusBtn.title = "Auto-reply: " + (DATA.autoReply ? "on" : "off");
    if(!DATA.autoReply) clearReply();
    r.classList.toggle("on", DATA.autoReply);
    r.querySelector(".tog").textContent = DATA.autoReply ? "On" : "Off";
    return;
  }
  closeAll();   // the rest are here for the shape of the menu
});

/* amount panel */
document.getElementById("payPanel").addEventListener("click", function(e){
  var step = e.target.closest("[data-step]");
  if(step){ payAmt = Math.max(1, payAmt + (+step.dataset.step)); paintAmt(); return; }
  if(e.target.closest("#showKp")){ openKeypad(); return; }
  var act = e.target.closest("[data-pay]");
  if(act) stagePayment(act.dataset.pay);
});

/* keypad */
var KP = ["1","2","3","4","5","6","7","8","9",".","0","del"];
(function buildKeypad(){
  var g = document.getElementById("kpGrid");
  KP.forEach(function(k){
    var b = document.createElement("button");
    b.type = "button";
    if(k === "del") b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 5h11v14H9l-6-7z"/><path d="M13 9.5l4.5 5M17.5 9.5l-4.5 5"/></svg>';
    else b.textContent = k;
    b.addEventListener("click", function(){ kpTap(k); });
    g.appendChild(b);
  });
})();
function kpTap(k){
  if(k === "del") kpBuf = kpBuf.slice(0, -1);
  else if(k === "."){ if(kpBuf.indexOf(".") === -1) kpBuf = (kpBuf || "0") + "."; }
  else {
    var d = kpBuf.split(".")[1];
    if(d && d.length >= 2) return;          // cents only go two deep
    if(kpBuf.replace(".", "").length >= 6) return;
    kpBuf = (kpBuf === "0" ? "" : kpBuf) + k;
  }
  payAmt = parseFloat(kpBuf) || 0;
  paintAmt();
}
document.getElementById("payKeypad").addEventListener("click", function(e){
  var act = e.target.closest("[data-pay]");
  if(act) stagePayment(act.dataset.pay);
});

/* Send/Request stages the card in the composer — nothing is in the
   thread until you send it from there, same as the real flow. */
var payKind = "send";
function stagePayment(kind){
  if(payAmt <= 0) return;
  payKind = kind;
  closeAll();
  paintAmt();
  document.querySelector(".composer").classList.add("paying");
  document.getElementById("payNote").value = "";
}
document.getElementById("payCancel").addEventListener("click", function(){
  document.querySelector(".composer").classList.remove("paying");
});
document.getElementById("payNote").addEventListener("focus", function(){
  if(!editing()) kbEl.classList.add("up");
});
document.getElementById("payNote").addEventListener("blur", function(){
  kbEl.classList.remove("up");
});
document.getElementById("paySend").addEventListener("click", sendPayment);

function sendPayment(){
  if(editing()) return;
  var note = document.getElementById("payNote").value.trim();
  DATA.thread.push({ from:"me", pay:fmtAmt(payAmt), kind:payKind });
  if(note) DATA.thread.push({ from:"me", text:note });
  save();
  document.querySelector(".composer").classList.remove("paying");
  document.getElementById("payNote").value = "";
  kbEl.classList.remove("up");
  renderThread(false); bindEdits(); popLast(); toBottom(true);
  payAmt = 1; kpBuf = ""; paintAmt();
}

paintAmt();

/* ---- keyboard ----
   Raised while the field has focus, exactly like the real one. The
   keys drive the same input, so either way of typing works. */
const ROWS=[
  "QWERTYUIOP".split(""),
  "ASDFGHJKL".split(""),
  "ZXCVBNM".split(""),
];
let caps=true;   // iOS starts a message shifted

function keyEl(label,cls){
  const b=document.createElement("button");
  b.type="button";b.className="key"+(cls?" "+cls:"");
  if(label)b.textContent=label;
  // mousedown, not click: the field must not lose focus, or the
  // keyboard would slide away underneath the tap.
  b.addEventListener("mousedown",e=>e.preventDefault());
  return b;
}
function renderKeyboard(){
  const rows=[...kbEl.querySelectorAll(".krow")];
  rows.forEach(r=>r.innerHTML="");

  ROWS[0].forEach(ch=>rows[0].appendChild(letter(ch)));
  ROWS[1].forEach(ch=>rows[1].appendChild(letter(ch)));

  const shift=keyEl("",'mod'+(caps?" on":""));
  shift.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 3l8 8h-4.5v7h-7v-7H4z"/></svg>';
  shift.addEventListener("click",()=>{caps=!caps;renderKeyboard();});
  rows[2].appendChild(shift);
  ROWS[2].forEach(ch=>rows[2].appendChild(letter(ch)));
  const del=keyEl("",'mod');
  del.innerHTML='<svg viewBox="0 0 24 24"><path d="M9 5h11v14H9l-6-7z"/><path d="M13 9.5l4.5 5M17.5 9.5l-4.5 5"/></svg>';
  del.addEventListener("click",()=>{type(null,true);});
  rows[2].appendChild(del);

  const num=keyEl("123","mod");num.addEventListener("click",()=>inputEl.focus());
  const emo=keyEl("🙂","mod");emo.addEventListener("click",()=>type("🙂"));
  const space=keyEl("space","wide");space.addEventListener("click",()=>type(" "));
  const go=keyEl("return","go");go.addEventListener("click",send);
  rows[3].append(num,emo,space,go);
}
function letter(ch){
  const b=keyEl(caps?ch:ch.toLowerCase());
  b.addEventListener("click",()=>type(caps?ch:ch.toLowerCase()));
  return b;
}
function type(ch,back){
  if(editing())return;
  if(back)inputEl.value=inputEl.value.slice(0,-1);
  else{
    inputEl.value+=ch;
    // iOS drops the shift after the first character.
    if(caps&&/[A-Z]/.test(ch)){caps=false;renderKeyboard();}
  }
  syncField();
}

inputEl.addEventListener("focus",()=>{if(!editing())kbEl.classList.add("up");});
inputEl.addEventListener("blur",()=>{kbEl.classList.remove("up");});

/* ---- editing ---- */
function bindEdits(){
  const on=editing();
  document.querySelectorAll("[data-edit]").forEach(el=>{
    el.setAttribute("contenteditable",on);
    el.oninput=()=>{DATA[el.getAttribute("data-edit")]=el.textContent;save();applyScalars();};
  });
  document.querySelectorAll("[data-msg]").forEach(el=>{
    el.setAttribute("contenteditable",on);
    el.oninput=()=>{
      const i=+el.getAttribute("data-msg");
      // The delete button lives inside the bubble, so read the text
      // nodes rather than the whole textContent.
      const t=[...el.childNodes].filter(n=>n.nodeType===3).map(n=>n.nodeValue).join("");
      if(DATA.thread[i])DATA.thread[i].text=t;
      save();
    };
  });
  // Dividers and mid-thread receipts. Editing either one converts it to
  // plain text — see setRich.
  document.querySelectorAll("[data-pay-amt]").forEach(el=>{
    el.setAttribute("contenteditable",on);
    el.oninput=()=>{
      const item=DATA.thread[+el.getAttribute("data-pay-amt")];
      if(item)item.pay=el.textContent;
      save();
    };
  });
  document.querySelectorAll("[data-div]").forEach(el=>{
    el.setAttribute("contenteditable",on);
    el.oninput=()=>{
      const item=DATA.thread[+el.getAttribute("data-div")];
      if(!item)return;
      if(el.dataset.field==="receipt"){item.receipt=el.textContent;item.receiptPlain=true;}
      else {item.t=el.textContent;item.plain=true;}
      save();
    };
  });
}

/* Scalars that feed something other than their own text node. */
function applyScalars(){document.getElementById("av").style.background=DATA.avatar;}
function restoreScalars(){
  document.querySelectorAll("[data-edit]").forEach(el=>{
    const k=el.getAttribute("data-edit");
    if(DATA[k]!==undefined)el.textContent=DATA[k];
  });
  applyScalars();
}

document.getElementById("editBtn").addEventListener("click",function(){
  const on=document.body.classList.toggle("editing");
  this.classList.toggle("on",on);this.textContent=on?"✓ Done":"✎ Edit";
  if(on){clearReply();kbEl.classList.remove("up");closeAll();document.querySelector(".composer").classList.remove("paying");}
  bindEdits();
});
document.getElementById("resetBtn").addEventListener("click",()=>{
  if(confirm("Reset this dashboard to its original values?")){
    localStorage.removeItem(KEY);DATA=structuredClone(DEFAULT_DATA);
    clearReply();inputEl.value="";fieldEl.classList.remove("has");
    caps=true;renderKeyboard();
    plusBtn.classList.toggle("off",!DATA.autoReply);
    renderThread(true);restoreScalars();bindEdits();
  }
});

plusBtn.classList.toggle("off",!DATA.autoReply);
plusBtn.title="Auto-reply: "+(DATA.autoReply?"on":"off");
renderKeyboard();renderThread(true);restoreScalars();bindEdits();
</script>
