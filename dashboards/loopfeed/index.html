<style>
:root{
  --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --pink:#FF6B9D;
  --cyan:#4DE0D0;
  --bg:#000;
  --card:#121212;
  --card2:#1c1c1e;
  --text:#fff;
  --sub:#a8a8a8;
  --green:#3fe08a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:var(--font);
  background:#0a0a0a;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:60px 12px 40px;
  color:var(--text);
}

/* back + toolbar chrome */
.back{
  position:fixed;top:18px;left:18px;z-index:2147483002;
  background:#1c1c1e;border:1px solid #333;color:#fff;
  padding:9px 16px;border-radius:10px;text-decoration:none;
  font:600 13px/1 var(--font);
}
.back:active{background:#2a2a2c;}
.toolbar{
  position:fixed;top:18px;right:18px;z-index:2147483002;
  display:flex;gap:8px;
}
.toolbar button{
  background:#1c1c1e;border:1px solid #333;color:#fff;
  padding:9px 14px;border-radius:10px;cursor:pointer;
  font:600 13px/1 var(--font);
}
.toolbar button:active{background:#2a2a2c;}
.toolbar button.on{background:var(--pink);border-color:var(--pink);}

/* phone */
.phone{
  width:390px;height:844px;
  background:var(--bg);
  border-radius:44px;
  box-shadow:0 0 0 11px #101012, 0 0 0 13px #000, 0 30px 80px rgba(0,0,0,.7);
  overflow:hidden;
  position:relative;
  display:flex;flex-direction:column;
}
.notch{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:150px;height:30px;background:#000;border-radius:0 0 18px 18px;z-index:40;
}
.scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding-bottom:90px;
}
.scroll::-webkit-scrollbar{display:none;}

/* status bar */
.statusbar{
  height:52px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 26px 6px;font-size:14px;font-weight:600;flex-shrink:0;
}
.statusbar .icons{display:flex;gap:6px;align-items:center;}

/* app header */
.appbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;
}
.appbar .chev,.appbar .info{
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
}
.appbar .title{font-size:17px;font-weight:700;}

/* hero */
.hero{padding:8px 22px 4px;}
.hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.hero-label{font-size:14px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px;}
.hero-label svg{opacity:.7;}
.period-pill{
  background:var(--card2);border:1px solid #2c2c2e;
  color:#fff;font-size:12.5px;font-weight:600;
  padding:7px 12px;border-radius:20px;display:flex;align-items:center;gap:5px;cursor:pointer;
}
.big-earn{
  font-size:52px;font-weight:900;letter-spacing:-1.5px;line-height:1;
  margin:2px 0 10px;
}
.delta{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(63,224,138,.12);color:var(--green);
  font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:20px;
}
.delta.neg{background:rgba(254,44,85,.12);color:var(--pink);}

/* period tabs */
.tabs{
  display:flex;gap:6px;margin:18px 0 6px;padding:0 22px;position:relative;
}
.tab{
  flex:1;text-align:center;padding:9px 0 12px;
  font-size:13.5px;font-weight:700;color:var(--sub);cursor:pointer;
  position:relative;transition:color .2s;
}
.tab.active{color:#fff;}
.tab-underline{
  position:absolute;bottom:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--cyan),var(--pink));
  transition:left .32s cubic-bezier(.5,.1,.2,1),width .32s cubic-bezier(.5,.1,.2,1);
}

/* chart */
.chart-wrap{padding:14px 18px 6px;}
.chart-card{
  background:var(--card);border:1px solid #1e1e1e;border-radius:20px;
  padding:16px 14px 10px;
}
.chart-svg{width:100%;height:150px;display:block;}
.chart-xaxis{display:flex;justify-content:space-between;padding:8px 6px 2px;}
.chart-xaxis span{font-size:11px;color:#6a6a6a;font-weight:600;}

/* metric tiles */
.tiles{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
  padding:16px 18px 6px;
}
.tile{
  background:var(--card);border:1px solid #1e1e1e;border-radius:18px;
  padding:15px 15px 16px;
}
.tile .t-label{font-size:12px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:9px;}
.tile .t-dot{width:8px;height:8px;border-radius:50%;}
.tile .t-val{font-size:23px;font-weight:800;letter-spacing:-.5px;}

/* videos */
.section-h{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 22px 8px;
}
.section-h h3{font-size:16px;font-weight:800;}
.section-h a{font-size:13px;color:var(--sub);text-decoration:none;font-weight:600;}
.vid-list{padding:2px 18px 10px;}
.vid{
  display:flex;align-items:center;gap:13px;padding:10px 4px;
}
.thumb{
  width:48px;height:62px;border-radius:11px;flex-shrink:0;position:relative;
  overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.4);
}
.thumb .play{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));
}
.vid-meta{flex:1;min-width:0;}
.vid-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;}
.vid-views{font-size:12px;color:var(--sub);font-weight:500;display:flex;align-items:center;gap:5px;}
.vid-earn{font-size:15px;font-weight:800;color:#fff;flex-shrink:0;}

/* edit mode */
[data-edit]{outline:none;border-radius:4px;transition:box-shadow .15s,background .15s;}
body.editing [data-edit]{
  box-shadow:0 0 0 1.5px var(--pink);
  outline:1px dashed var(--pink);outline-offset:2px;
  cursor:text;background:rgba(254,44,85,.06);
}

/* entrance animations */
.vid,.tile{opacity:0;transform:translateY(10px);animation:rise .5s cubic-bezier(.2,.7,.3,1) forwards;}
.appeared{opacity:1;transform:none;}
@keyframes rise{to{opacity:1;transform:none;}}

.foot{padding:14px 22px 30px;text-align:center;color:#555;font-size:11px;font-weight:500;line-height:1.6;}

<script>
/* ============================================================
   DATA — edit here to change the dashboard defaults
   ============================================================ */
const DATA = {
  earnings: "$1,247.82",
  delta: "+18.2%",
  metrics: {
    m_qviews: "2.4M",
    m_rpm: "$0.52",

    m_followers: "+8,420"
  },
  // headline value per period-tab (7D / 30D / 60D / All)

    "all": { earn: "$9,884.00", label: "All time",     delta: "+—",     prev: "lifetime"     }
  },
  // daily earnings per period, in dollars — these add up to the
  // "Estimated rewards" figure above the chart
  series: {
    "7":   [34,52,41,68,59,80,72],
    "30":  [22,30,26,41,38,52,44,60,55,48,63,58,71,66,54,72,68,80,74,62,78,72,88,82,70,90,84,95,88,100],
    "60":  [12,18,15,24,20,30,26,34,29,25,38,33,44,39,30,46,42,52,47,36,50,45,58,53,42,60,55,66,61,48,54,62,58,70,65,52,72,68,78,73,60,80,75,84,79,66,86,82,90,85,72,92,88,96,91,78,98,94,100,97],
    "all": [8,14,10,20,16,26,30,24,34,40,36,46,42,52,48,58,54,64,60,70,66,76,72,82,78,88,84,94,90,100]
  },
  xlabels: {
    "7":   ["Mon","","Wed","","Fri","","Sun"],
    "30":  ["Wk 1","Wk 2","Wk 3","Wk 4",""],
    "60":  ["Wk 1","","Wk 3","","Wk 5",""],
    "all": ["Jan","","Apr","","Aug","Dec"]
  },
  videos: [
    { title: "3 editing tricks that blew up 🔥", views: "412K", earn: "$182.40", c1:"#FF6B9D", c2:"#7a0f26" },
    { title: "Day in my life as a creator", views: "388K", earn: "$164.10", c1:"#4DE0D0", c2:"#0d5f5c" },
    { title: "Answering your questions pt.4", views: "301K", earn: "$121.85", c1:"#8b5cf6", c2:"#3b1e6e" },
    { title: "This changed how I film 🎬", views: "256K", earn: "$98.20", c1:"#f59e0b", c2:"#6e480a" },
    { title: "POV: the algorithm loves you", views: "198K", earn: "$71.55", c1:"#ec4899", c2:"#6e1e44" }
  ]
};

const LS_KEY = "loopfeed-dash-v1";

/* ---------- persistence ---------- */
function loadSaved(){
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveField(key, val){
  const s = loadSaved();
  s[key] = val;
  localStorage.setItem(LS_KEY, JSON.stringify(s));
}
function applySaved(){
  const s = loadSaved();
  document.querySelectorAll("[data-edit]").forEach(el=>{
    const k = el.getAttribute("data-edit");
    if (s[k] != null) el.textContent = s[k];
  });
}

/* ---------- render videos ---------- */
function renderVideos(){
  const list = document.getElementById("vidList");
  list.innerHTML = "";
  DATA.videos.forEach((v,i)=>{
    const row = document.createElement("div");
    row.className = "vid";
    row.innerHTML = `
      <div class="thumb" style="background:linear-gradient(155deg,${v.c1},${v.c2})">
        <div class="play">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="#fff"><path d="M6 4l10 6-10 6V4z"/></svg>

          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" stroke="#a8a8a8" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="#a8a8a8" stroke-width="1.6"/></svg>
          <span data-edit="vid_views_${i}">${v.views}</span> views
        </div>
      </div>
      <div class="vid-earn" data-edit="vid_earn_${i}">${v.earn}</div>`;
    list.appendChild(row);

}

/* ---------- chart ---------- */
const NS = "http://www.w3.org/2000/svg";
let currentDays = "30";

/* The bars are daily earnings, so they add up to the figure above the
   chart. Retyping it rescales every range. */
function earningsTarget(){
  const el = document.getElementById("bigEarn");
  return parseFloat(String(el ? el.textContent : "").replace(/[^0-9.]/g, "")) || 0;
}
function rescaleEarnings(){
  const target = earningsTarget();
  Object.keys(DATA.series).forEach(function(k){
    const arr = DATA.series[k], sum = arr.reduce(function(a,b){return a+b;}, 0);
    DATA.series[k] = sum > 0 ? arr.map(function(v){return v*(target/sum);})
                             : arr.map(function(){return target/arr.length;});
  });
}
let curDays="30";   // which range the chart is currently showing
function drawChart(days, animate){
  curDays = days;
  const svg = document.getElementById("chart");
  svg.innerHTML = "";
  const data = DATA.series[days];
  const W = 340, H = 150;
  const n = data.length;
  const gap = n > 20 ? 2 : (n > 12 ? 3 : 6);
  const bw = (W - gap*(n-1)) / n;
  // Fixed floor on the scale: normalising to the series' own peak drew
  // the same chart whether the period earned $200 or $20,000.
  const dayScale = Math.max(1, earningsTarget() / data.length * 2.4);
  const max = Math.max(dayScale, ...data);

  // gradient defs
  const defs = document.createElementNS(NS,"defs");
  defs.innerHTML = `
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4DE0D0"/>
      <stop offset="100%" stop-color="#FF6B9D"/>
    </linearGradient>`;
  svg.appendChild(defs);

  data.forEach((val,i)=>{
    const h = (val/max) * (H-14);
    const x = i*(bw+gap);
    const y = H - h;
    const r = document.createElementNS(NS,"rect");
    r.setAttribute("x", x.toFixed(2));
    r.setAttribute("width", bw.toFixed(2));
    r.setAttribute("rx", Math.min(bw/2,3).toFixed(2));
    r.setAttribute("fill", "url(#barGrad)");
    if (animate){
      r.setAttribute("y", H);
      r.setAttribute("height", 0);
      svg.appendChild(r);
      // stagger grow
      setTimeout(()=>{
        r.style.transition = "y .6s cubic-bezier(.2,.8,.3,1), height .6s cubic-bezier(.2,.8,.3,1)";
        r.setAttribute("y", y.toFixed(2));
        r.setAttribute("height", h.toFixed(2));
      }, 30 + i*(n>20?9:22));
    } else {
      r.setAttribute("y", y.toFixed(2));
      r.setAttribute("height", h.toFixed(2));
      svg.appendChild(r);
    }
  });

  // x-axis labels
  const xax = document.getElementById("xaxis");
  xax.innerHTML = "";
  DATA.xlabels[days].forEach(l=>{
    const s = document.createElement("span");
    s.textContent = l;
    xax.appendChild(s);
  });
}

/* ---------- count-up ---------- */
function parseNum(str){
  // returns {num, prefix, suffix} preserving formatting hints
  const m = str.match(/^([^\d\-]*)([\-+]?[\d,]*\.?\d+)\s*([A-Za-z%]*)$/);
  if(!m) return null;
  return { prefix: m[1], num: parseFloat(m[2].replace(/,/g,"")), suffix: m[3], raw: m[2] };
}
function fmtLike(target, val){
  const p = parseNum(target);
  if(!p) return target;
  let out;
  if (p.suffix === "M" || p.suffix === "K"){
    out = val.toFixed(1);
  } else if (/\./.test(p.raw)){
    out = val.toFixed(2);
  } else {
    out = Math.round(val).toString();
  }
  // thousands separator if original had one
  if (/,/.test(p.raw) && !/\./.test(out)){
    out = Number(out).toLocaleString("en-US");
  } else if (/,/.test(p.raw)){
    const parts = out.split(".");
    parts[0] = Number(parts[0]).toLocaleString("en-US");
    out = parts.join(".");
  }
  return p.prefix + out + p.suffix;
}
function countUp(el, dur){
  const target = el.textContent.trim();
  const p = parseNum(target);
  if(!p){ return; }
  const start = performance.now();
  function step(t){
    let k = Math.min(1,(t-start)/dur);
    k = 1 - Math.pow(1-k,3); // ease-out cubic
    el.textContent = fmtLike(target, p.num * k);
    if(k<1) requestAnimationFrame(step);
    else el.textContent = target;
  }
  requestAnimationFrame(step);
}

/* ---------- tabs / period ---------- */
function moveUnderline(tab){
  const u = document.getElementById("underline");
  const tabsBox = document.getElementById("tabs");
  const boxRect = tabsBox.getBoundingClientRect();
  const r = tab.getBoundingClientRect();
  u.style.left = (r.left - boxRect.left + r.width*0.22) + "px";
  u.style.width = (r.width*0.56) + "px";
}
function selectPeriod(days, tab){
  currentDays = days;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  tab.classList.add("active");
  moveUnderline(tab);

  const key = days;
  const P = DATA.periods[key];
  if (P){
    // only update headline if user hasn't overridden earnings via edit-save for 30D default
    const bigEl = document.getElementById("bigEarn");
    bigEl.textContent = P.earn;
    countUp(bigEl, 700);
    document.getElementById("periodPillText").textContent = P.label;
    const deltaEl = document.getElementById("delta");
    deltaEl.querySelector("[data-edit='delta']").textContent = P.delta;
    deltaEl.childNodes[deltaEl.childNodes.length-1].textContent = " vs " + P.prev;
    deltaEl.classList.toggle("neg", P.delta.trim().startsWith("-"));
  }
  drawChart(days, true);
}

/* ---------- edit mode ---------- */
let editing = false;
const editBtn = document.getElementById("editBtn");
editBtn.addEventListener("click", ()=>{
  editing = !editing;
  document.body.classList.toggle("editing", editing);
  editBtn.classList.toggle("on", editing);
  editBtn.textContent = editing ? "✓ Done" : "✎ Edit";
  document.querySelectorAll("[data-edit]").forEach(el=>{
    el.contentEditable = editing ? "true" : "false";
    if(editing){
      el.addEventListener("blur", onEditBlur);
    } else {
      el.removeEventListener("blur", onEditBlur);
    }
  });
});
function onEditBlur(e){
  const el = e.currentTarget;
  const key = el.getAttribute("data-edit");
  saveField(key, el.textContent.trim());
}
/* Live-redraw the bars while the earnings figure is being typed. */
document.getElementById("bigEarn").addEventListener("input",()=>{
  if(!editing) return;
  rescaleEarnings();
  drawChart(curDays||"30", false);
});

document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(confirm("Reset all values to defaults? This clears saved edits.")){
    localStorage.removeItem(LS_KEY);
    location.reload();
  }
});

/* period pill just cycles to next tab as a shortcut */
document.getElementById("periodPill").addEventListener("click", ()=>{
  if(editing) return;
  const tabs = [...document.querySelectorAll(".tab")];
  const idx = tabs.findIndex(t=>t.classList.contains("active"));
  const next = tabs[(idx+1)%tabs.length];
  selectPeriod(next.dataset.days, next);
});

/* ---------- init ---------- */
function init(){
  renderVideos();
  applySaved();

  // tab clicks
  document.querySelectorAll(".tab").forEach(tab=>{
    tab.addEventListener("click", ()=>{ if(!editing) selectPeriod(tab.dataset.days, tab); });
  });

  // underline initial position
  const activeTab = document.querySelector(".tab.active");
  requestAnimationFrame(()=> moveUnderline(activeTab));

  // draw chart animated
  drawChart("30", true);

  // count-up big number + tiles (visible-only guard)
  function runCounts(){
    countUp(document.getElementById("bigEarn"), 900);
    document.querySelectorAll("[data-count]").forEach((el,i)=>{
      setTimeout(()=> countUp(el, 800), 200 + i*90);
    });
  }
  if(document.visibilityState==="visible"){ runCounts(); }
  else document.addEventListener("visibilitychange", function h(){
    if(document.visibilityState==="visible"){ runCounts(); document.removeEventListener("visibilitychange", h); }
  });

  // stagger fade-in for tiles + videos
  const staggerEls = [...document.querySelectorAll(".tile"), ...document.querySelectorAll(".vid")];
  staggerEls.forEach((el,i)=>{
    setTimeout(()=> el.classList.add("appeared"), 250 + i*70);
  });
}

window.addEventListener("load", init);
window.addEventListener("resize", ()=>{
  const activeTab = document.querySelector(".tab.active");
  if(activeTab) moveUnderline(activeTab);
});
</script>
