<!DOCTYPE html>
<html lang="en" data-krypt-status="translucent">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>App Store · Product page (Learning Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     APP STORE — a learning recreation of the iOS App Store,
     modelled on real product pages.
     Screens: Search results -> Product page.

     The design lesson is the install control, which has three
     distinct forms and is the only thing on the row that changes:

       GET    never downloaded on this Apple ID — a filled blue pill
       ☁      owned but not on this device — a bare blue glyph, no pill
       OPEN   installed right now — a filled blue pill

     Tap any of them to cycle through all three.

     Also here: the horizontally scrolling stat strip, the ratings
     histogram, the screenshot carousel and the privacy cards.

     Follows the system light/dark setting, like the real thing.
     Everything user-facing is data-driven — see DEFAULT_DATA in the
     script below. Toggle "Edit" to click-edit values in the page;
     changes save to your browser (localStorage).
     ============================================================ */

  :root{
    color-scheme: light dark;
    --bg:#ffffff;
    --bg2:#f2f2f7;          /* grouped background */
    --ink:#000000;
    --muted:#8e8e93;        /* secondary label */
    --muted2:#aeaeb2;       /* tertiary label */
    --line:#d1d1d6;         /* separator */
    --blue:#007aff;
    --fill:#e8e8ed;         /* secondary fill */
    --chip:rgba(120,120,128,.12);
    --tab:rgba(249,249,249,.82);
    --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000;
      --bg2:#1c1c1e;
      --ink:#ffffff;
      --muted:#8e8e93;
      --muted2:#636366;
      --line:#38383a;
      --blue:#0a84ff;
      --fill:#2c2c2e;
      --chip:rgba(120,120,128,.28);
      --tab:rgba(28,28,30,.78);
    }
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#0a0a0a;font-family:var(--font);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;-webkit-font-smoothing:antialiased;}

  .back{position:fixed;top:18px;left:18px;z-index:50;background:#1c1c1e;color:#fff;border:1px solid #333;text-decoration:none;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;font-family:var(--font);transition:.15s;}
  .back:hover{background:#2a2a2c;}
  .toolbar{position:fixed;top:18px;right:18px;display:flex;gap:8px;z-index:50;}
  .toolbar button{background:#1c1c1e;color:#fff;border:1px solid #333;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:.15s;}
  .toolbar button:hover{background:#2a2a2c;}
  .toolbar button.on{background:var(--blue);color:#fff;border-color:var(--blue);}

  /* ---- Phone frame ---- */
  .phone{position:relative;width:390px;max-width:100%;height:844px;background:var(--bg);border-radius:44px;box-shadow:0 0 0 12px #111,0 40px 90px rgba(0,0,0,.7);overflow:hidden;display:flex;flex-direction:column;}

  /* ---- Status bar ---- */
  .statusbar{display:flex;align-items:center;justify-content:space-between;padding:15px 30px 4px;font-size:15px;font-weight:600;letter-spacing:.3px;color:var(--ink);flex:0 0 auto;background:var(--bg);z-index:6;}
  .statusbar .right{display:flex;align-items:center;gap:7px;}
  .battery{border:1.5px solid var(--ink);border-radius:4px;width:26px;height:13px;position:relative;display:flex;align-items:center;padding:1.5px;}
  .battery::after{content:"";position:absolute;right:-4px;top:4px;width:2px;height:5px;background:var(--ink);border-radius:0 2px 2px 0;}
  .battery i{display:block;height:100%;background:var(--ink);border-radius:1.5px;width:84%;}
  .signal{display:flex;align-items:flex-end;gap:2px;height:12px;}
  .signal b{width:3px;background:var(--ink);border-radius:1px;display:block;}
  .signal b:nth-child(1){height:5px}.signal b:nth-child(2){height:7px}
  .signal b:nth-child(3){height:9px}.signal b:nth-child(4){height:12px}

  .screen{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;background:var(--bg);}
  .screen::-webkit-scrollbar{display:none;}

  .view{display:none;}
  .view.on{display:block;animation:vfade .22s ease;}
  @keyframes vfade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

  /* ============ the install control ============
     GET / OPEN are filled blue pills; the redownload cloud is a bare
     blue glyph with no pill behind it at all. */
  .getbtn{background:var(--blue);color:#fff;border:none;font-family:var(--font);
    font-size:16px;font-weight:700;letter-spacing:.2px;padding:7px 0;width:86px;
    border-radius:999px;text-align:center;cursor:pointer;transition:.14s;}
  .getbtn:hover{filter:brightness(1.08);}
  .getbtn:active{transform:scale(.94);}
  .cloudbtn{width:86px;height:32px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:.14s;background:none;border:0;padding:0;}
  .cloudbtn svg{width:30px;height:30px;}
  .cloudbtn:active{transform:scale(.9);}
  .iap{font-size:10px;color:var(--muted);line-height:1.25;}

  /* ============ SEARCH ============ */
  .s-title{font-size:34px;font-weight:800;letter-spacing:-1px;padding:2px 16px 10px;}
  .s-field{margin:0 16px 6px;background:var(--chip);border-radius:10px;height:36px;display:flex;align-items:center;gap:7px;padding:0 9px;}
  .s-field svg{width:15px;height:15px;flex:0 0 auto;}
  .s-field .q{flex:1;min-width:0;font-size:16px;font-weight:400;color:var(--ink);outline:none;}
  .s-field .clr{width:17px;height:17px;border-radius:50%;background:var(--muted);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:0 0 auto;cursor:pointer;}
  .s-cancel{color:var(--blue);font-size:16px;padding:0 16px 12px;text-align:right;cursor:pointer;}

  .res{padding:0 0 20px;}
  .rrow{padding:14px 16px 16px;border-top:.5px solid var(--line);opacity:0;animation:rise .5s ease forwards;}
  .rrow:first-child{border-top:none;}
  .rtop{display:flex;align-items:center;gap:12px;}
  .icon{width:62px;height:62px;border-radius:14px;flex:0 0 auto;overflow:hidden;position:relative;box-shadow:inset 0 0 0 .5px rgba(128,128,128,.28);display:flex;align-items:center;justify-content:center;}
  .icon img{width:100%;height:100%;object-fit:cover;display:block;}
  .rmid{flex:1;min-width:0;}
  .rname{font-size:16px;font-weight:600;letter-spacing:-.2px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rsub{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rstars{display:flex;align-items:center;gap:4px;margin-top:5px;}
  .stars{display:flex;gap:1px;}
  .stars svg{width:11px;height:11px;}
  .rcount{font-size:11.5px;color:var(--muted2);}
  .rright{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;width:88px;}

  .shots{display:flex;gap:8px;margin-top:13px;}
  .shot{flex:1;aspect-ratio:9/16;border-radius:9px;overflow:hidden;position:relative;box-shadow:inset 0 0 0 .5px rgba(128,128,128,.22);}

  /* Stand-in app screenshots. Percentage based so the same markup reads
     correctly in both the 9:16 search thumbnails and the taller 9:19.5
     carousel — these rules must cover both. */
  .shot .sh-photo,.cshot .sh-photo{position:absolute;left:8%;right:8%;top:7%;height:52%;border-radius:8px;opacity:.94;}
  .shot .sh-bar,.cshot .sh-bar{position:absolute;border-radius:3px;background:rgba(255,255,255,.66);}
  .shot .sh-dot,.cshot .sh-dot{position:absolute;bottom:7%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.72);}

  /* ============ PRODUCT PAGE ============ */
  .p-nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:transparent;}
  /* Circular translucent chips, as on the real page — not text links. */
  .p-chip{width:34px;height:34px;border-radius:50%;background:var(--chip);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;}
  .p-chip svg{width:18px;height:18px;}

  .p-head{display:flex;gap:16px;padding:4px 16px 20px;}
  .p-head .icon{width:118px;height:118px;border-radius:26px;animation:pop .5s ease forwards;}
  .p-hmid{flex:1;min-width:0;display:flex;flex-direction:column;}
  .p-name{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1.16;}
  .p-sub{font-size:15px;color:var(--muted);margin-top:4px;line-height:1.3;}
  .p-actions{margin-top:auto;display:flex;align-items:center;gap:12px;padding-top:14px;}

  /* horizontally scrolling stat strip */
  .strip{display:flex;overflow-x:auto;scrollbar-width:none;padding:16px 16px 18px;border-top:.5px solid var(--line);}
  .strip::-webkit-scrollbar{display:none;}
  .stat{flex:0 0 auto;min-width:104px;padding:0 18px;border-right:.5px solid var(--line);text-align:center;}
  .stat:last-child{border-right:none;}
  .stat .k{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
  .stat .v{font-size:21px;font-weight:700;color:var(--muted);margin-top:6px;letter-spacing:-.4px;white-space:nowrap;}
  .stat .v.small{font-size:13px;font-weight:600;line-height:1.25;}
  .stat .sub{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;}
  .stat .starrow{display:flex;justify-content:center;gap:1.5px;margin-top:6px;}
  .stat .starrow svg{width:11px;height:11px;}

  .carousel{display:flex;gap:11px;overflow-x:auto;scrollbar-width:none;padding:18px 16px 20px;border-top:.5px solid var(--line);}
  .carousel::-webkit-scrollbar{display:none;}
  .cshot{flex:0 0 auto;width:190px;aspect-ratio:9/19.5;border-radius:18px;overflow:hidden;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.18);}

  .sect{padding:18px 16px;border-top:.5px solid var(--line);}
  .sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .sect-h h2{font-size:22px;font-weight:700;letter-spacing:-.5px;}
  .sect-h a{color:var(--blue);font-size:15px;text-decoration:none;cursor:pointer;}
  .verline{display:flex;align-items:baseline;justify-content:space-between;margin-top:9px;font-size:13px;color:var(--muted);}
  .body-txt{font-size:15px;line-height:1.45;margin-top:10px;color:var(--ink);}
  .body-txt.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .more{color:var(--blue);font-size:15px;margin-top:2px;cursor:pointer;display:inline-block;}

  /* ratings + histogram */
  .rate-wrap{display:flex;align-items:flex-start;gap:20px;margin-top:14px;}
  .rate-big{flex:0 0 auto;}
  .rate-big .n{font-size:56px;font-weight:800;letter-spacing:-2.5px;line-height:.95;}
  .rate-big .o{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .hist{flex:1;min-width:0;padding-top:2px;}
  .hbar{display:flex;align-items:center;gap:7px;margin-bottom:3px;}
  .hbar .st{display:flex;gap:.5px;width:52px;justify-content:flex-end;flex:0 0 auto;}
  .hbar .st svg{width:8px;height:8px;}
  .hbar .tr{flex:1;height:5px;border-radius:3px;background:var(--fill);overflow:hidden;}
  .hbar .fl{height:100%;border-radius:3px;background:var(--muted);width:0;transition:width .9s cubic-bezier(.2,.8,.3,1);}
  .rate-count{text-align:right;font-size:12.5px;color:var(--muted);margin-top:6px;}

  /* privacy cards */
  .priv{display:flex;gap:11px;margin-top:14px;}
  .pcard{flex:1;background:var(--bg2);border-radius:12px;padding:13px 12px;}
  .pcard .pi{color:var(--muted);}
  .pcard .pi svg{width:22px;height:22px;}
  .pcard .pt{font-size:13.5px;font-weight:700;margin-top:8px;line-height:1.25;}
  .pcard .pd{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.3;}

  /* information rows */
  .inforow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:.5px solid var(--line);font-size:14.5px;}
  .inforow:last-child{border-bottom:none;}
  .inforow .k{color:var(--muted);flex:0 0 auto;}
  .inforow .v{text-align:right;color:var(--ink);min-width:0;}

  /* ---- Bottom tab bar ----
     A floating translucent pill inset from the edges, with the active
     tab in its own lighter chip. */
  .tabbar{position:absolute;left:12px;right:12px;bottom:14px;height:62px;
    background:var(--tab);-webkit-backdrop-filter:blur(24px) saturate(180%);
    backdrop-filter:blur(24px) saturate(180%);
    border-radius:999px;display:flex;align-items:center;justify-content:space-around;
    padding:0 6px;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.22);}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);
    font-size:10px;font-weight:500;cursor:pointer;flex:1;padding:7px 0;border-radius:999px;
    transition:.15s;}
  .tab svg{width:24px;height:24px;}
  .tab.active{color:var(--blue);background:var(--chip);}
  .tab:not(.active):hover{opacity:.7;}

  body.editing [data-edit]{outline:1.5px dashed var(--blue);outline-offset:3px;border-radius:4px;cursor:text;}
  [data-edit]:focus{outline:1.5px solid var(--blue);}
  body.editing .getbtn,body.editing .cloudbtn{outline:1.5px dashed #ff9500;outline-offset:3px;border-radius:999px;}
  .hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:#666;font-size:12px;text-align:center;line-height:1.5;}
</style>

    },
    {
      id:"tinder", art:"tinder", name:"Tinder — Dating & Chat", sub:"Match. Chat. Date.",
      state:"get", iap:"In-App<br>Purchases",

const KEY="appstore-dash-v2";
let DATA=load();
function load(){try{const s=localStorage.getItem(KEY);if(s)return{...structuredClone(DEFAULT_DATA),...JSON.parse(s)};}catch(e){}return structuredClone(DEFAULT_DATA);}
function save(){localStorage.setItem(KEY,JSON.stringify(DATA));}
function editing(){return document.body.classList.contains("editing");}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function appById(id){return DATA.apps.find(a=>a.id===id)||DATA.apps[0];}
function artFor(a){return `<img src="../../assets/appstore/${a.art}.png" alt="" draggable="false">`;}

const STAR=(fill)=>`<svg viewBox="0 0 24 24" fill="${fill}"><path d="M12 2.6l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17.6 6.1 20.8l1.2-6.6L2.5 9.6l6.6-.9z"/></svg>`;
const HALF=`<svg viewBox="0 0 24 24"><defs><linearGradient id="hf"><stop offset="50%" stop-color="#8e8e93"/><stop offset="50%" stop-color="#8e8e9340"/></linearGradient></defs><path d="M12 2.6l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17.6 6.1 20.8l1.2-6.6L2.5 9.6l6.6-.9z" fill="url(#hf)"/></svg>`;

function starRow(rating){
  const r=parseFloat(rating)||0;let out="";
  for(let i=1;i<=5;i++){
    if(r>=i) out+=STAR("#8e8e93");
    else if(r>=i-0.5) out+=HALF;
    else out+=STAR("#8e8e9340");
  }
  return out;
}

/* stand-in screenshot: photo panel, two text lines, three action buttons */
function shotInner(sh,seed){
  const [a,b,ac]=sh;
  const lift=(seed%3)*3;
  return `<div style="position:absolute;inset:0;background:linear-gradient(160deg,${a},${b})"></div>
    <div class="sh-photo" style="top:${7+lift}%;background:${ac}"></div>
    <div class="sh-bar" style="left:10%;width:44%;top:${64+lift}%;height:3.4%"></div>
    <div class="sh-bar" style="left:10%;width:28%;top:${70+lift}%;height:2.8%;opacity:.62"></div>
    <div class="sh-dot" style="left:15%;width:14%"></div>
    <div class="sh-dot" style="left:41%;width:18%;bottom:5.5%;background:rgba(255,255,255,.92)"></div>
    <div class="sh-dot" style="right:15%;width:14%"></div>`;
}

/* The "In-App Purchases" caption sits beside GET and OPEN, but not beside
   the redownload cloud — on the real page the cloud stands on its own. */
function iapFor(app){
  return app.state==="cloud" ? "" : `<div class="iap">${app.iap||""}</div>`;
}

/* ---- the install control ---- */
function installBtn(app){
  if(app.state==="open")
    return `<button class="getbtn" data-install="${app.id}">OPEN</button>`;
  if(app.state==="cloud")
    return `<button class="cloudbtn" data-install="${app.id}" aria-label="Redownload">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.2 18.2H6.9A4.4 4.4 0 0 1 6 9.5a5.9 5.9 0 0 1 11.4-1.5 3.9 3.9 0 0 1-.2 10.2z"/>
        <path d="M12 9.6v5.8M9.6 13.1 12 15.5l2.4-2.4"/></svg></button>`;
  return `<button class="getbtn" data-install="${app.id}">GET</button>`;
}

/* ============ SEARCH RESULTS ============ */
function renderResults(){
  const el=document.getElementById("results");el.innerHTML="";
  DATA.apps.forEach((a,i)=>{

          <div class="rname" data-edit="a-${i}-name">${esc(a.name)}</div>
          <div class="rsub" data-edit="a-${i}-sub">${esc(a.sub)}</div>
          <div class="rstars">
            <span class="stars">${starRow(a.rating)}</span>
            <span class="rcount" data-edit="a-${i}-ratings">${esc(a.ratings)}</span>
          </div>
        </div>
        <div class="rright">

    el.appendChild(row);
  });
  bindAll();
}

/* ============ routing ============ */
function show(view){
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.dataset.view===view));
  document.getElementById("screen").scrollTop=0;
}

/* ============ interaction ============ */
function bindAll(){
  document.querySelectorAll("[data-open]").forEach(el=>{
    el.onclick=()=>{
      if(editing())return;
      DATA.detail=el.getAttribute("data-open");save();
      renderProduct();show("product");
    };
  });

  document.querySelectorAll("[data-install]").forEach(el=>{
    el.onclick=(e)=>{
      e.stopPropagation();
      const a=appById(el.getAttribute("data-install"));
      a.state=({get:"cloud",cloud:"open",open:"get"})[a.state]||"get";
      save();
      renderResults();
      if(document.querySelector('.view[data-view="product"]').classList.contains("on"))renderProduct();
    };
  });

  bindEdits();
}

/* The "out of 5" figure is the weighted mean of the histogram beside
   it, so editing one has to move the other. Bars are re-derived from an
   exponential skew — the shape real store histograms have — solved by
   bisection so their mean lands on the rating you typed. */
function histForRating(target){
  const t=Math.max(1,Math.min(5,parseFloat(target)||0));
  const meanOf=a=>{let n=0,d=0;for(let k=0;k<5;k++){n+=(5-k)*a[k];d+=a[k];}return d?n/d:0;};
  const build=x=>{const a=[];for(let k=0;k<5;k++)a.push(Math.exp(x*(5-k)));
    const s=a.reduce((p,q)=>p+q,0);return a.map(v=>v/s*100);};
  let lo=-6,hi=6;
  for(let i=0;i<50;i++){const mid=(lo+hi)/2; if(meanOf(build(mid))<t) lo=mid; else hi=mid;}
  return build((lo+hi)/2).map(v=>Math.round(v*10)/10);
}
function bindEdits(){
  document.querySelectorAll("[data-edit]").forEach(el=>{
    el.setAttribute("contenteditable",editing());
    el.oninput=()=>{
      const k=el.getAttribute("data-edit"),v=el.textContent;let m;
      if(m=k.match(/^a-(\d+)-(\w+)$/)){
        const app=DATA.apps[+m[1]]; app[m[2]]=v;
        if(m[2]==="rating"){
          app.hist=histForRating(v);
          // Repaint just this app's bars; re-rendering the page would
          // pull the caret out of the field being typed in.
          // Scoped by app index: the same rating appears in the search
          // row and on the product page, so el.closest() would miss.
          const tot=app.hist.reduce((a,b)=>a+b,0);
          document.querySelectorAll('[data-hist="'+m[1]+'"] .fl').forEach((fl,i)=>{
            const w=Math.round(app.hist[i]/tot*100);
            fl.setAttribute("data-w",w); fl.style.width=w+"%";});
        }
      }
      else DATA[k]=v;
      save();
    };
  });
}

document.getElementById("pBack").addEventListener("click",()=>show("search"));

document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    if(t.dataset.tab==="search")show("search");
  });
});

document.getElementById("editBtn").addEventListener("click",function(){
  const on=document.body.classList.toggle("editing");
  this.classList.toggle("on",on);this.textContent=on?"✓ Done":"✎ Edit";bindEdits();
});
document.getElementById("resetBtn").addEventListener("click",()=>{
  if(confirm("Reset this dashboard to its original values?")){
    localStorage.removeItem(KEY);DATA=structuredClone(DEFAULT_DATA);
    document.querySelector('[data-edit="query"]').textContent=DATA.query;
    renderResults();renderProduct();show("search");
  }
});

/* Init */
renderResults();
renderProduct();
document.querySelector('[data-edit="query"]').textContent=DATA.query;
